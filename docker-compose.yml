services:
  postgres:
    image: postgres:16-alpine
    container_name: kinetic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinetic
      POSTGRES_PASSWORD: kinetic_local_password
      POSTGRES_DB: kinetic
    ports:
      - "5433:5432"
    volumes:
      - kinetic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetic -d kinetic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kinetic_postgres_data:
